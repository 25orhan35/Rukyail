<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#09090f">
<title>Rukyail</title>

<!-- Firebase SDK (Modular Core) -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getDatabase, ref, push, onChildAdded, set, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

  // TODO: Firebase Konsolunuzdan alacağınız konfigürasyon bilgilerini buraya yapıştırın
  const firebaseConfig = {
    apiKey: "YOUR_API_KEY",
    authDomain: "YOUR_PROJECT.firebaseapp.com",
    databaseURL: "https://YOUR_PROJECT-default-rtdb.firebaseio.com",
    projectId: "YOUR_PROJECT",
    storageBucket: "YOUR_PROJECT.appspot.com",
    messagingSenderId: "YOUR_SENDER_ID",
    appId: "YOUR_APP_ID"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);

  window.db = db;
  window.dbRef = ref;
  window.dbPush = push;
  window.dbOnChildAdded = onChildAdded;
  window.dbSet = set;
  window.dbOnValue = onValue;
</script>

<style>
*{box-sizing:border-box}

body{
margin:0;
background:#08080d;
color:#eee;
font-family:Arial,sans-serif
}

.app{
max-width:600px;
min-height:100vh;
margin:auto;
padding:20px;
background:
radial-gradient(circle at top,#302441,#111119 45%,#08080d)
}

.logo{
text-align:center;
padding:35px 10px
}

.logo h1{
margin:0;
font-size:36px;
letter-spacing:8px
}

.logo p{
color:#aaa
}

.card{
background:#12121a;
border:1px solid #393044;
border-radius:20px;
padding:20px;
margin-bottom:18px
}

input,textarea{
width:100%;
padding:14px;
margin:7px 0;
border-radius:12px;
border:1px solid #40364d;
background:#09090e;
color:white;
outline:none
}

button{
width:100%;
padding:14px;
margin-top:8px;
border:0;
border-radius:12px;
background:#694b88;
color:white;
font-weight:bold;
cursor:pointer;
}

button:active{
transform:scale(.98)
}

.hidden{
display:none!important
}

.notice{
background:#1d1825;
border-left:4px solid #a679c7;
padding:14px;
border-radius:10px;
margin-bottom:15px
}

.messages{
height:400px;
overflow-y:auto;
padding:5px
}

.message{
background:#1a1921;
padding:11px;
border-radius:13px;
margin:8px 0
}

.message .name{
font-size:12px;
color:#b58bd4;
font-weight:bold;
display:flex;
justify-content:space-between;
}

.message .time{
font-size:10px;
color:#666;
}

.message .text{
margin-top:5px;
word-break:break-word;
}

.error-text{
color:#ff5555;
font-size:13px;
margin-top:8px;
}

.small{
font-size:12px;
color:#777;
text-align:center
}
</style>
</head>

<body>

<div class="app">

<div class="logo">
<h1>RUKYAIL</h1>
<p>Özel topluluğun sessiz odası</p>
</div>

<div id="login" class="card">
<h2>Üyelik</h2>
<p>Sohbet odasına katılmak için kayıt ol.</p>

<input id="name" type="text" placeholder="İsim" autocomplete="given-name">
<input id="surname" type="text" placeholder="Soyisim" autocomplete="family-name">

<button onclick="register()">KAYIT OL</button>
<p id="error" class="error-text"></p>
</div>

<div id="member" class="hidden">

<div class="card">
<h2>🌑 RUKYAIL ODASI</h2>

<div id="announcement"></div>

<div id="messages" class="messages"></div>

<input id="message" type="text" placeholder="Bir şeyler yaz..." onkeydown="if(event.key==='Enter')send()">
<button onclick="send()">GÖNDER</button>
</div>

<div class="card">
<h3>📢 Son Dakika</h3>
<textarea id="news" rows="4" placeholder="Duyurunu yaz..."></textarea>
<button onclick="publish()">YAYINLA</button>
</div>

<div class="card">
<button onclick="logout()">ÇIKIŞ YAP</button>
</div>

</div>

<div class="small">
Rukyail © 2026
</div>

</div>

<script>
const USER_KEY = "rukyail_user";
let user = JSON.parse(localStorage.getItem(USER_KEY) || "null");

function register() {
  const name = document.getElementById("name").value.trim();
  const surname = document.getElementById("surname").value.trim();

  if (!name || !surname) {
    document.getElementById("error").textContent = "İsim ve soyisim zorunludur.";
    return;
  }

  user = { name, surname };
  localStorage.setItem(USER_KEY, JSON.stringify(user));
  openRoom();
}

function openRoom() {
  document.getElementById("login").classList.add("hidden");
  document.getElementById("member").classList.remove("hidden");
  
  initRealtimeListeners();
}

function send() {
  if (!user) return;
  const input = document.getElementById("message");
  const text = input.value.trim();
  if (!text) return;

  const payload = {
    name: `${user.name} ${user.surname}`,
    text: text,
    timestamp: Date.now(),
    time: new Date().toLocaleTimeString("tr-TR", { hour: "2-digit", minute: "2-digit" })
  };

  // Firebase Realtime DB'ye Ekleme
  if (window.db) {
    const messagesRef = window.dbRef(window.db, 'messages');
    window.dbPush(messagesRef, payload);
  }

  input.value = "";
}

function publish() {
  if (!user) return;
  const text = document.getElementById("news").value.trim();
  if (!text) return;

  if (window.db) {
    const newsRef = window.dbRef(window.db, 'announcement');
    window.dbSet(newsRef, {
      text: text,
      author: `${user.name} ${user.surname}`
    });
  }

  document.getElementById("news").value = "";
}

function initRealtimeListeners() {
  if (!window.db) return;

  // Mesajları Dinleme
  const messagesBox = document.getElementById("messages");
  messagesBox.innerHTML = "";
  
  const messagesRef = window.dbRef(window.db, 'messages');
  window.dbOnChildAdded(messagesRef, (snapshot) => {
    const item = snapshot.val();
    appendSingleMessage(item);
  });

  // Duyuruları Dinleme
  const newsRef = window.dbRef(window.db, 'announcement');
  window.dbOnValue(newsRef, (snapshot) => {
    const data = snapshot.val();
    renderNews(data ? data.text : "");
  });
}

function appendSingleMessage(item) {
  const box = document.getElementById("messages");
  const div = document.createElement("div");
  div.className = "message";
  div.innerHTML = `
    <div class="name">
      <span>${escapeHTML(item.name)}</span>
      <span class="time">${escapeHTML(item.time || '')}</span>
    </div>
    <div class="text">${escapeHTML(item.text)}</div>
  `;
  box.appendChild(div);
  box.scrollTop = box.scrollHeight;
}

function renderNews(text) {
  const box = document.getElementById("announcement");
  if (!text) {
    box.innerHTML = "";
    return;
  }
  box.innerHTML = `
    <div class="notice">
      <b>⚡ SON DAKİKA</b><br><br>
      ${escapeHTML(text)}
    </div>
  `;
}

function logout() {
  user = null;
  localStorage.removeItem(USER_KEY);
  document.getElementById("member").classList.add("hidden");
  document.getElementById("login").classList.remove("hidden");
}

function escapeHTML(text) {
  return String(text)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

if (user) {
  openRoom();
}
</script>

</body>
  </html>
